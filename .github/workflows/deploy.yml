name: Deploy to VPS

on:
  push:
    branches: [clean-branch]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_BACK_END_URL_API: ${{ secrets.NEXT_PUBLIC_BACK_END_URL_API }}

      - name: Transfer files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: admin_marabu
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          source: ".next,public,package.json,package-lock.json,next.config.*"
          target: "/home/admin_marabu/apps/marabu_website/deploy-staging"
          strip_components: 0

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: admin_marabu
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            DEPLOY_DIR=/home/admin_marabu/apps/marabu_website
            STAGING_DIR=$DEPLOY_DIR/deploy-staging
            CURRENT_DIR=$DEPLOY_DIR/current

            # Sauvegarder l'ancienne version
            if [ -d "$CURRENT_DIR" ]; then
              mv "$CURRENT_DIR" "$DEPLOY_DIR/backup-$(date +%Y%m%d-%H%M%S)"
            fi

            # Promouvoir le staging en current
            mv "$STAGING_DIR" "$CURRENT_DIR"

            cd "$CURRENT_DIR"

            # Installer uniquement les dépendances de production
            npm ci --omit=dev

            # Vérifier que le build existe
            if [ ! -d ".next" ]; then
              echo "Erreur: Le build .next n'existe pas!"
              exit 1
            fi

            # Redémarrer le service PM2
            pm2 stop marabuwebtest 2>/dev/null || true
            pm2 delete marabuwebtest 2>/dev/null || true
            lsof -ti:3001 | xargs kill -9 2>/dev/null || true
            pm2 start npm --name "marabuwebtest" -- start -- -p 3001
            pm2 save

            # Nettoyer les anciennes sauvegardes (garder les 5 plus récentes)
            cd "$DEPLOY_DIR"
            ls -dt backup-* 2>/dev/null | tail -n +6 | xargs -r rm -rf

            echo "Déploiement terminé avec succès!"
